---
- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the consul system user
  ansible.builtin.user:
    name: consul
    system: true
    home: "{{ consul_data_dir }}"
    create_home: false
    shell: /bin/false

- name: Create Consul directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: consul
    group: consul
    mode: "0750"
  loop:
    - "{{ consul_config_dir }}"
    - "{{ consul_data_dir }}"

- name: Check the installed Consul version
  ansible.builtin.command: /usr/local/bin/consul version
  register: consul_installed
  changed_when: false
  failed_when: false

- name: Download and install Consul
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    include:
      - consul
    owner: root
    group: root
    mode: "0755"
  when: consul_installed.stdout is not search('Consul v' ~ (consul_version | regex_escape) ~ '\n')
  notify: Restart consul

- name: Write the Consul agent configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: consul
    group: consul
    mode: "0640"
    validate: /usr/local/bin/consul validate -config-format=hcl %s
  notify: Restart consul

- name: Install the Consul systemd unit
  ansible.builtin.template:
    src: consul.service.j2
    dest: /etc/systemd/system/consul.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart consul

- name: Enable and start Consul
  ansible.builtin.systemd_service:
    name: consul
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the HTTP API
  ansible.builtin.wait_for:
    port: 8500
    host: 127.0.0.1
    timeout: 60
