---
- name: Install unzip and openssl
  ansible.builtin.apt:
    name:
      - unzip
      - openssl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check the installed consul-template version
  ansible.builtin.command: /usr/local/bin/consul-template -version
  register: consul_template_installed
  changed_when: false
  failed_when: false

- name: Download and install consul-template
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/consul-template/{{ consul_template_version }}/consul-template_{{ consul_template_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    include:
      - consul-template
    owner: root
    group: root
    mode: "0755"
  when: (consul_template_installed.stdout ~ consul_template_installed.stderr) is not search('v' ~ (consul_template_version | regex_escape) ~ ' ')
  notify: Restart consul-template

- name: Create the consul-template directory
  ansible.builtin.file:
    path: "{{ consul_template_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the HAProxy certificate directory
  ansible.builtin.file:
    path: /etc/haproxy/certs
    state: directory
    owner: root
    group: haproxy
    mode: "0750"

- name: Find certificates for the *:443 bind
  ansible.builtin.find:
    paths: /etc/haproxy/certs
    patterns: "*.pem"
  register: consul_template_certs

- name: Create a self-signed placeholder certificate
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      umask 077
      openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
        -subj "/CN={{ consul_template_selfsigned_cn }}" \
        -keyout /etc/haproxy/certs/selfsigned.key -out /etc/haproxy/certs/selfsigned.crt
      cat /etc/haproxy/certs/selfsigned.crt /etc/haproxy/certs/selfsigned.key > /etc/haproxy/certs/selfsigned.pem
      rm -f /etc/haproxy/certs/selfsigned.crt /etc/haproxy/certs/selfsigned.key
      chgrp haproxy /etc/haproxy/certs/selfsigned.pem
      chmod 0640 /etc/haproxy/certs/selfsigned.pem
    executable: /bin/bash
    creates: /etc/haproxy/certs/selfsigned.pem
  when: consul_template_certs.matched == 0

- name: Install the HAProxy template
  ansible.builtin.copy:
    src: haproxy.ctmpl
    dest: "{{ consul_template_config_dir }}/haproxy.ctmpl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart consul-template

- name: Write the consul-template configuration
  ansible.builtin.template:
    src: config.hcl.j2
    dest: "{{ consul_template_config_dir }}/config.hcl"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart consul-template

- name: Install the consul-template systemd unit
  ansible.builtin.template:
    src: consul-template.service.j2
    dest: /etc/systemd/system/consul-template.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart consul-template

# consul-template reloads HAProxy after every render ("systemctl reload
# haproxy" in the post), which fails while HAProxy is not running
- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started

- name: Enable and start consul-template
  ansible.builtin.systemd_service:
    name: consul-template
    enabled: true
    state: started
    daemon_reload: true
