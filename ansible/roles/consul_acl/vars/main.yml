---
_consul_acl_tokens:
  - description: agent token
    policy: agent
    accessor: "{{ consul_acl_agent_token_accessor }}"
    secret: "{{ consul_acl_agent_token_secret }}"
  - description: dataplaneapi
    policy: dataplaneapi
    accessor: "{{ consul_acl_dataplaneapi_token_accessor }}"
    secret: "{{ consul_acl_dataplaneapi_token_secret }}"
